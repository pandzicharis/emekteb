# Opcionalno: lokalna Postgres baza, ako ne želiš raditi direktno na Supabase.
#   docker compose up -d
# Konekcija: postgresql://postgres:postgres@localhost:5439/emekteb?schema=public
services:
  postgres:
    image: postgres:16-alpine
    container_name: emekteb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emekteb
    ports:
      - '5439:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
