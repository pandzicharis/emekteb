version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: emekteb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emekteb
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emekteb-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: emekteb-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emekteb?schema=public
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emekteb-network
    working_dir: /app/apps/api
    command: sh -c "cd /app/apps/api && npm run start:dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: emekteb-web
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api
    networks:
      - emekteb-network
    command: npm run dev --workspace=@emekteb/web

volumes:
  postgres_data:

networks:
  emekteb-network:
    driver: bridge

