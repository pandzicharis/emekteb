<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Mekteb - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen overflow-hidden bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full max-h-screen overflow-y-auto">
        <!-- Card Container -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-7 space-y-5 border border-gray-100">
            <!-- Header -->
            <div class="text-center">
                <div class="flex justify-center mb-3">
                    <div class="bg-gradient-to-br from-indigo-600 to-purple-600 p-3 rounded-2xl shadow-lg transform hover:scale-105 transition-transform duration-200">
                        <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                </div>
                <h2 class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                    E-Mekteb
                </h2>
                <p class="mt-1 text-sm font-medium text-gray-700">
                    Džemat Grbavica 2
                </p>
                <p class="mt-1 text-xs text-gray-500">
                    Prijavite se na svoj nalog
                </p>
            </div>

            <!-- Email Login Form -->
            <form class="space-y-4">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Email adresa
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                            </svg>
                        </div>
                        <input
                            id="email"
                            type="text"
                            class="block w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 bg-gray-50 focus:bg-white text-gray-900 placeholder-gray-400 shadow-sm hover:shadow-md"
                            placeholder="unesite@email.com"
                            value="ime.prezime@emekteb.ba"
                        />
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="lozinka" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Lozinka
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                        <input
                            id="lozinka"
                            type="password"
                            class="block w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200 bg-gray-50 focus:bg-white text-gray-900 placeholder-gray-400 shadow-sm hover:shadow-md"
                            placeholder="••••••••"
                            value="password123"
                        />
                    </div>
                </div>

                <!-- Submit Button -->
                <div>
                    <button
                        type="submit"
                        class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-lg text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]"
                    >
                        <span class="flex items-center">
                            <span>Prijavi se</span>
                            <svg class="ml-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                            </svg>
                        </span>
                    </button>
                </div>
            </form>

            <!-- Quick Login Section -->
            <div class="pt-4 border-t border-gray-200 space-y-3">
                <div class="text-center">
                    <p class="text-sm font-semibold text-gray-700 mb-1">Nedavno logirani korisnici</p>
                    <p class="text-xs text-gray-500">Kliknite na korisnika za prijavu sa PIN-om</p>
                </div>
                <div class="flex flex-nowrap justify-center items-start gap-3 overflow-x-auto pb-2 px-2">
                    <!-- Example User 1 -->
                    <button class="group relative flex flex-col items-center gap-2 p-3 rounded-xl bg-gradient-to-br from-gray-50 to-gray-100 hover:from-indigo-50 hover:to-purple-50 border-2 border-transparent hover:border-indigo-200 transition-all duration-200 shadow-sm hover:shadow-lg flex-shrink-0 w-[100px] h-[110px]">
                        <div class="w-12 h-12 flex-shrink-0 rounded-full border-2 border-white shadow-lg group-hover:border-indigo-300 transition-all overflow-hidden bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg">
                            IP
                        </div>
                        <div class="text-center w-full">
                            <p class="text-xs font-semibold text-gray-900 truncate">Ime Prezime</p>
                            <p class="text-[10px] text-gray-500 mt-0.5">Muallim</p>
                            <p class="text-[10px] text-indigo-600 font-medium mt-1">2 sata</p>
                        </div>
                    </button>

                    <!-- Example User 2 -->
                    <button class="group relative flex flex-col items-center gap-2 p-3 rounded-xl bg-gradient-to-br from-gray-50 to-gray-100 hover:from-indigo-50 hover:to-purple-50 border-2 border-transparent hover:border-indigo-200 transition-all duration-200 shadow-sm hover:shadow-lg flex-shrink-0 w-[100px] h-[110px]">
                        <div class="w-12 h-12 flex-shrink-0 rounded-full border-2 border-white shadow-lg group-hover:border-indigo-300 transition-all overflow-hidden bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center text-white font-bold text-lg">
                            AM
                        </div>
                        <div class="text-center w-full">
                            <p class="text-xs font-semibold text-gray-900 truncate">Admin</p>
                            <p class="text-[10px] text-gray-500 mt-0.5">Admin</p>
                            <p class="text-[10px] text-indigo-600 font-medium mt-1">1 dan</p>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
